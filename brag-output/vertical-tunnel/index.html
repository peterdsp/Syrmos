<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#0D0F12"},
    {"id":"color-ink","type":"color","label":"Text","default":"#E6ECF4"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#6FB4FF"},
    {"id":"font-display","type":"string","label":"Display font","default":"Inter"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --ground: var(--color-ground, #0D0F12); --ink: var(--color-ink, #E6ECF4); --accent: var(--color-accent, #6FB4FF); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; }
      #ground { position: absolute; inset: 0; background: var(--ground); z-index: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11.46"
         data-width="1080" data-height="1920">
      <div id="ground"></div>
      <div id="tunnel" data-composition-id="tunnel" data-composition-src="compositions/tunnel.html"
           data-start="0" data-duration="11.46" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index: 1"></div>

      <audio id="bed" data-start="0" data-duration="11.46" data-track-index="10"
             data-volume="0.26" data-fade-in="0.8" data-fade-out="1.4"
             src="assets/music/syrmos-commute-bgm.mp3"></audio>

      <audio id="t-train1" data-start="2.05" data-duration="0.18" data-track-index="11" data-volume="0.30" src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>
      <audio id="t-tick" data-start="3.25" data-duration="0.06" data-track-index="12" data-volume="0.34" src="assets/sfx/ui/click2.ogg"></audio>
      <audio id="t-settle" data-start="3.28" data-duration="0.12" data-track-index="13" data-volume="0.46" src="assets/sfx/impact/impactSoft_medium_000.ogg"></audio>
      <audio id="t-train2" data-start="4.80" data-duration="0.18" data-track-index="14" data-volume="0.44" src="assets/sfx/impact/impactSoft_medium_004.ogg"></audio>
      <audio id="t-line" data-start="5.98" data-duration="0.14" data-track-index="15" data-volume="0.40" src="assets/sfx/impact/impactSoft_medium_003.ogg"></audio>
      <audio id="t-end" data-start="8.88" data-duration="1.48" data-track-index="16" data-volume="0.42" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
