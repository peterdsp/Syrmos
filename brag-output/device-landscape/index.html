<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#121417"},
    {"id":"color-ink","type":"color","label":"Text","default":"#E8ECF2"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#2FA8FF"},
    {"id":"font-display","type":"string","label":"Display font","default":"Inter"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --ground: var(--color-ground, #121417); --ink: var(--color-ink, #E8ECF2); --accent: var(--color-accent, #2FA8FF); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; }
      #ground { position: absolute; inset: 0; background: var(--ground); z-index: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13.11"
         data-width="1920" data-height="1080">
      <div id="ground"></div>
      <div id="bench" data-composition-id="bench" data-composition-src="compositions/bench.html"
           data-start="0" data-duration="13.11" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080" style="z-index: 1"></div>

      <audio id="bed" data-start="0" data-duration="13.11" data-track-index="10"
             data-volume="0.28" data-fade-in="0.8" data-fade-out="1.4"
             src="assets/music/syrmos-commute-bgm.mp3"></audio>

      <audio id="l-l1" data-start="3.80" data-duration="0.14" data-track-index="11" data-volume="0.42" src="assets/sfx/impact/impactSoft_medium_003.ogg"></audio>
      <audio id="l-l2" data-start="4.89" data-duration="0.12" data-track-index="12" data-volume="0.38" src="assets/sfx/interface/bong_001.ogg"></audio>
      <audio id="l-mid" data-start="8.72" data-duration="0.12" data-track-index="13" data-volume="0.26" src="assets/sfx/impact/impactSoft_medium_000.ogg"></audio>
      <audio id="l-end" data-start="10.35" data-duration="1.48" data-track-index="14" data-volume="0.44" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
