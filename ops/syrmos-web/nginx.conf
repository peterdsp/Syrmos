server {
    listen 80;
    server_name syrmos.peterdsp.dev localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation so the on-device LLM (wllama) can run multi-threaded
    # via SharedArrayBuffer. Without these the app still works: wllama falls back
    # to a single thread (slower). Applied site-wide so index.html is isolated.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /favicon.png {
        add_header Cache-Control "no-cache";
    }

    location ~* ^/files/.*\.json$ {
        add_header Cache-Control "no-cache";
    }

    types {
        application/wasm wasm;
        application/javascript js;
        text/html html;
        text/css css;
        image/png png;
        application/json json;
        application/octet-stream gguf;
    }

    # The on-device model (~1.1 GB GGUF) is a static, content-addressed asset:
    # cache it hard so it is fetched once and then loaded from the browser cache.
    location ~* \.gguf$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location ~* \.wasm$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.css$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.map$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types application/javascript application/wasm text/html text/css;
}
