# Drop-in hardening for syrmos-admin.service.
#
# The base unit already sets Restart=always, but systemd's default start-rate
# limiter will park the unit in 'failed' after 5 rapid restarts and then STOP
# trying — the likely reason the API stayed down for ~9 days from 2026-08-18.
#
# Here we widen the limiter to a bounded-but-generous window and let the
# external watchdog (syrmos-health.timer) be the outer safety net: it runs
# `systemctl reset-failed` + `restart` every 2 minutes, so the unit can never
# stay permanently parked, while the app is never hot-looped every 3 seconds.
[Unit]
StartLimitIntervalSec=120
StartLimitBurst=5

[Service]
Restart=always
RestartSec=5

# Log to the journal, not a flat append-file. The base unit used
# StandardOutput=append:/home/peterdsp/syrmos-api/admin.log; when that file's
# blocks went bad (SD-card corruption on 2026-08-18) systemd failed at step
# STDOUT (status=209/STDOUT) on every start, so the API stayed down for 9 days
# even with Restart=always. journald is corruption-resilient and self-rotating.
StandardOutput=journal
StandardError=journal
