name: Release iOS

# Archives the iOS app (which embeds the watchOS app + widget extension) and
# uploads it to TestFlight when a version tag is pushed (for example v1.2.1),
# or on manual dispatch.
#
# Least-privilege manual signing (klipa's cert-import pattern): the App Store
# Connect API key stays App Manager and is used only for the UPLOAD. Signing
# uses an imported Apple Distribution certificate + explicit App Store
# provisioning profiles, so no Admin/cloud-signing permission is needed.
#
# Secret-gated: with the distribution cert absent the job skips cleanly, so a
# tag still releases web + Android.
#
# Required repo secrets:
#   Signing (manual):
#     IOS_DIST_CERT_P12_BASE64      base64 of the Apple Distribution cert .p12
#     IOS_DIST_CERT_P12_PASSWORD    the .p12 export password
#     CI_KEYCHAIN_PASSWORD          any string; password for the temp keychain
#     IOS_PROFILE_APP_BASE64        App Store profile "Syrmos AppStore"  (com.syrmosApp.ios)
#     IOS_PROFILE_WATCH_BASE64      "Syrmos Watch AppStore"        (com.syrmosApp.ios.watchkitapp)
#     IOS_PROFILE_COMPLICATION_BASE64 "Syrmos Complication AppStore" (....watchkitapp.complications)
#     IOS_PROFILE_WIDGET_BASE64     "Syrmos Widget AppStore"       (com.syrmosApp.ios.SyrmosWidget)
#   Upload (App Manager key is fine):
#     ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8_BASE64
#
# Profile names must match scripts/export-options.plist. Team id YTS4KJBX3P.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the signed IPA against App Store Connect but do NOT upload to TestFlight (release-readiness check only)."
        type: boolean
        default: true

concurrency:
  group: release-ios-${{ github.ref }}
  cancel-in-progress: false

# A tag push always releases (upload to TestFlight). A manual run defaults to a
# dry run: it signs, exports, and validates the IPA, and keeps it as an
# artifact, but never uploads. Set dry_run=false on a manual run to also upload.
env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  testflight:
    name: Archive + upload to TestFlight
    needs: ci
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SCHEME: "Syrmos - Athens Rail Times"
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
      CI_KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Notice (signing secrets not set)
        if: ${{ env.IOS_DIST_CERT_P12_BASE64 == '' }}
        run: echo "iOS distribution cert secret not set - skipping iOS TestFlight upload."

      - name: Select the newest installed Xcode
        if: ${{ env.IOS_DIST_CERT_P12_BASE64 != '' }}
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      # The device archive uses the watchOS SDK bundled with Xcode; the
      # simulator runtime is not strictly required, and its download is a known
      # flaky runner step ("Unable to connect to simulator"). Retry a few times
      # and never let a transient download failure block the release.
      - name: Install watchOS simulator runtime (best-effort)
        if: ${{ env.IOS_DIST_CERT_P12_BASE64 != '' }}
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            xcodebuild -downloadPlatform watchOS && exit 0
            echo "watchOS runtime download attempt $i failed; retrying in 20s"
            sleep 20
          done
          echo "watchOS simulator runtime unavailable after retries; continuing (device archive uses the bundled SDK)."

      - name: Import signing certificate into a temp keychain
        if: ${{ env.IOS_DIST_CERT_P12_BASE64 != '' }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install App Store provisioning profiles
        if: ${{ env.IOS_DIST_CERT_P12_BASE64 != '' }}
        env:
          IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          IOS_PROFILE_WATCH_BASE64: ${{ secrets.IOS_PROFILE_WATCH_BASE64 }}
          IOS_PROFILE_COMPLICATION_BASE64: ${{ secrets.IOS_PROFILE_COMPLICATION_BASE64 }}
          IOS_PROFILE_WIDGET_BASE64: ${{ secrets.IOS_PROFILE_WIDGET_BASE64 }}
        run: |
          set -euo pipefail
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          write_profile () { echo "$2" | base64 --decode > "$DIR/$1.mobileprovision"; }
          write_profile app          "$IOS_PROFILE_APP_BASE64"
          write_profile watch        "$IOS_PROFILE_WATCH_BASE64"
          write_profile complication "$IOS_PROFILE_COMPLICATION_BASE64"
          write_profile widget       "$IOS_PROFILE_WIDGET_BASE64"
          ls -la "$DIR"

      # Stamp a unique, monotonically increasing build number. App Store Connect
      # requires CFBundleVersion to be strictly higher than any prior upload in
      # the same marketing-version train. Reading a static CURRENT_PROJECT_VERSION
      # forced a manual bump every release and silently collided (3.0.0-beta.1 and
      # beta.2 both resolved to build 138, so beta.2's upload was rejected). A Unix
      # epoch is always unique and increasing across releases, so no manual bump is
      # needed and collisions cannot recur.
      - name: Stamp a unique build number
        if: ${{ env.IOS_DIST_CERT_P12_BASE64 != '' }}
        run: |
          set -euo pipefail
          BUILD="$(date +%s)"
          if ! printf '%s' "$BUILD" | grep -Eq '^[0-9]+$'; then
            echo "::error::Build number is not numeric: '$BUILD'"; exit 1
          fi
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          # The app + widget get this via CURRENT_PROJECT_VERSION on the archive
          # command; the watch Info.plist has a literal CFBundleVersion, so set it
          # here too, keeping every embedded target on the same build number.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" iosApp/SyrmosWatch/Info.plist
          echo "Build number: $BUILD"

      # Archive UNSIGNED, then sign everything during export with the explicit
      # profiles + cert from scripts/export-options.plist. Signing all four
      # embedded targets manually on the archive command line is unreliable
      # (xcodebuild won't match installed profiles per embedded target), so we
      # let -exportArchive do the signing where the profile-name map applies.
      - name: Archive (unsigned)
        if: ${{ env.IOS_DIST_CERT_P12_BASE64 != '' }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project iosApp/Syrmos.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Syrmos.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO

      - name: Export App Store .ipa (manual signing)
        if: ${{ env.IOS_DIST_CERT_P12_BASE64 != '' }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Syrmos.xcarchive" \
            -exportOptionsPlist scripts/export-options.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Validate + upload to TestFlight
        if: ${{ env.IOS_DIST_CERT_P12_BASE64 != '' }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          echo "Uploading $IPA"

          # altool can exit 0 even when validation/upload fails (it prints the
          # error but returns success), which would let a broken build masquerade
          # as delivered. So capture the output and fail hard on any error marker.
          check_altool () {
            local log="$1"
            if grep -qiE "UPLOAD FAILED|Validation failed|Failed to (validate|upload) package|VALIDATION_ERROR|ERROR:" "$log"; then
              echo "::error::altool reported a failure - build NOT delivered."
              exit 1
            fi
          }

          # App Store Connect validation always runs (read-only pre-flight: it
          # checks the signed IPA against the store's rules without creating a
          # build or publishing anything).
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool-validate.log"
          check_altool "$RUNNER_TEMP/altool-validate.log"

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: signed IPA built + App Store validation passed; skipping the TestFlight upload."
            exit 0
          fi

          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool-upload.log"
          check_altool "$RUNNER_TEMP/altool-upload.log"
          echo "Verified delivery to App Store Connect / TestFlight."

      - name: Upload signed IPA + validation log (artifact)
        if: ${{ env.IOS_DIST_CERT_P12_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed-ipa
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/altool-validate.log
          if-no-files-found: warn
          retention-days: 7

      - name: Clean up secrets from the runner
        if: always()
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8 || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision || true
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
