name: Android tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Android/KMP unit and compile checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run shared and Android unit tests
        run: ./gradlew testDebugUnitTest --continue
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
          retention-days: 14

  instrumentation:
    name: Android instrumentation and Compose UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # GitHub-hosted ubuntu runners ship /dev/kvm but not the group permission
      # the emulator needs. Without hardware acceleration the AVD never finishes
      # booting, adb never connects, and the job dies with exit code 224. This
      # udev rule opens /dev/kvm to the runner, which is the supported fix.
      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run tests on a clean headless emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # -no-snapshot: boot clean every run instead of loading a saved
          # 'default_boot' snapshot that fails on a fresh runner.
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          script: ./gradlew :androidApp:connectedDebugAndroidTest --stacktrace
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
