name: CI

# Runs build + test for all three platforms. Called by the release workflows as
# a gate (releases only proceed when all three jobs pass), and also runs on
# every push to master and on pull requests.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:
  workflow_dispatch:

concurrency:
  # Reusable CI is called by both release workflows for the same tag. Include
  # the caller workflow name so iOS and Android cannot cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── KMP / Web ──────────────────────────────────────────────────────────
  kmp-tests:
    name: KMP tests + Web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run KMP common tests (Android unit tests)
        run: ./gradlew testDebugUnitTest --continue

      - name: Compile Web (wasmJs)
        run: ./gradlew :composeApp:compileKotlinWasmJs

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmp-test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  # ── Web JS (static client) ──────────────────────────────────────────────
  web-tests:
    name: Web JS tests (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run web guardrail + seed-contract tests
        # No dependencies to install: uses the built-in node:test runner.
        run: node --test

  # ── Android ────────────────────────────────────────────────────────────
  android:
    name: Android build + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug

      # Publish the debug APK so it can be installed on an emulator/device for
      # real runtime QA (a green compile is not runtime verification).
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: "**/build/reports/"
          retention-days: 7

  # ── iOS ────────────────────────────────────────────────────────────────
  ios:
    name: iOS build + tests
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Install watchOS simulator runtime
        continue-on-error: true
        run: xcodebuild -downloadPlatform watchOS

      - name: Build iOS app scheme
        run: |
          xcodebuild build \
            -project iosApp/Syrmos.xcodeproj \
            -scheme "Syrmos - Athens Rail Times" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run iOS tests
        run: |
          set -euo pipefail
          # Resolve a concrete, available iOS simulator by UDID. The previous
          # `-showdestinations | sed E ...` had a typo (`sed E`) and produced a
          # colon-format string xcodebuild can't use, so SIM_DEST was always
          # empty and fell back to a generic destination. Take the first UDID in
          # the "-- iOS ... --" section of `simctl list devices available`.
          SIM_ID="$(xcrun simctl list devices available \
            | sed -n '/-- iOS/,/^-- /p' \
            | grep -oiE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' \
            | head -1)"
          if [ -z "$SIM_ID" ]; then
            echo "::error::No available iOS simulator to run tests on"; exit 1
          fi
          echo "Testing on simulator $SIM_ID"
          # No `|| echo warning`: a real test failure now fails CI so the suite
          # genuinely gates against regressions.
          xcodebuild test \
            -project iosApp/Syrmos.xcodeproj \
            -scheme "Syrmos - Athens Rail Times" \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO
