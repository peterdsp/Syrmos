# Replaces ONLY the iPhone Duo screenshot set on the current App Store version
# and resubmits it for review, via the App Store Connect API. Other devices'
# screenshots are preserved. Manually triggered. Uses the same ASC API key as
# the build upload.
name: iPhone Duo screenshots (replace + resubmit)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list = inspect; replace = swap Duo screenshots + resubmit; resubmit = resubmit already-uploaded shots"
        type: choice
        options: [list, replace, resubmit, resubmit-build]
        default: list
      confirm:
        description: "For replace only: type 'yes' to un-submit and resubmit the version"
        required: false
        default: "no"

jobs:
  duo:
    name: Duo screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Run
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          if [ "${{ inputs.mode }}" = "replace" ]; then
            if [ "${{ inputs.confirm }}" != "yes" ]; then
              echo "replace requires confirm=yes; aborting"; exit 1
            fi
            bundle exec ruby scripts/asc_duo_screenshots.rb
          elif [ "${{ inputs.mode }}" = "resubmit" ]; then
            if [ "${{ inputs.confirm }}" != "yes" ]; then
              echo "resubmit requires confirm=yes; aborting"; exit 1
            fi
            RESUBMIT_ONLY=true bundle exec ruby scripts/asc_duo_screenshots.rb
          elif [ "${{ inputs.mode }}" = "resubmit-build" ]; then
            if [ "${{ inputs.confirm }}" != "yes" ]; then echo "needs confirm=yes"; exit 1; fi
            bundle exec ruby scripts/asc_resubmit_build.rb
          else
            bundle exec ruby scripts/asc_list_screenshots.rb
          fi
