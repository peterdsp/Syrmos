        <!-- Map chrome: top-left region chips -->
        <div class="map-chrome map-chrome--tl" id="regionChips">
            <button class="region-chip region-chip--active" type="button" data-region="athens" data-i18n="athens">Athens</button>
            <button class="region-chip" type="button" data-region="thessaloniki" data-i18n="thessaloniki">Thessaloniki</button>
            <button class="region-chip" type="button" data-region="national" data-i18n="national">National</button>
            <button class="region-chip" type="button" data-region="patras" data-i18n="patras">Patras</button>
        </div>

        <!-- Map chrome: top-right language + theme -->
        <div class="map-chrome map-chrome--tr">
            <div id="languagePicker" class="lang-segmented" role="group" aria-label="Language">
                <button class="lang-seg language-pill" type="button" data-lang="en" aria-pressed="false">EN</button>
                <button class="lang-seg language-pill" type="button" data-lang="el" aria-pressed="false">EL</button>
                <button class="lang-seg language-pill" type="button" data-lang="sq" aria-pressed="false">SQ</button>
            </div>
            <button id="themeToggleMap" class="chrome-button" type="button" aria-label="Toggle dark mode">
                <svg class="ic" aria-hidden="true"><use href="#ic-theme"/></svg>
            </button>
        </div>

        <!-- Map chrome: bottom-right zoom + locate -->
        <div class="map-chrome map-chrome--br">
            <div class="zoom-stack">
                <button id="zoomInButton" class="chrome-button" type="button" aria-label="Zoom in">
                    <svg class="ic" aria-hidden="true"><use href="#ic-zoom-in"/></svg>
                </button>
                <button id="zoomOutButton" class="chrome-button" type="button" aria-label="Zoom out">
                    <svg class="ic" aria-hidden="true"><use href="#ic-zoom-out"/></svg>
                </button>
            </div>
            <button id="locateButton" class="chrome-button chrome-button--accent" type="button" data-i18n-aria="locate_me" aria-label="Locate me">
                <svg class="ic" aria-hidden="true"><use href="#ic-locate"/></svg>
            </button>
        </div>

        <!-- Map chrome: bottom-left live-status pill -->
        <div class="map-chrome map-chrome--bl">
            <div class="live-status-pill" id="liveStatusPill">
                <span class="live-status-pill__dot"></span>
                <span id="liveStatusText" data-i18n="live_trains">Live trains</span>
            </div>
        </div>
    </main>

    <!-- Hidden controls for JS backward compatibility -->
    <button id="liveTrainsButton" type="button" aria-hidden="true" style="display:none"></button>
    <button id="vehiclesToggle" type="button" aria-hidden="true" style="display:none"></button>

    <!-- ===== Station Sheet ===== -->
    <section id="stationSheet" class="station-sheet station-sheet--hidden" aria-live="polite">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <div>
                <h2 id="stationName" data-i18n="select_a_station">Select a station</h2>
                <p id="stationNameEl" class="station-alt"></p>
            </div>
            <button id="sheetClose" class="ghost-button" type="button" data-i18n="done">Done</button>
        </div>

        <div class="sheet-content">
            <div class="sheet-block">
                <div class="sheet-label" data-i18n="lines_at_this_station">Lines at this station</div>
                <div id="lineBadges" class="badge-row"></div>
            </div>

            <div id="stationMetaBlock" class="sheet-block">
                <div id="stationMeta" class="meta-list"></div>
            </div>

            <div class="sheet-block">
                <div class="sheet-label" data-i18n="next_departures">Next departures</div>
                <div id="stationDepartures" class="departure-list" role="list"></div>
            </div>
        </div>

        <a id="directionsLink" class="primary-button sheet-footer-action" href="#" target="_blank" rel="noreferrer" data-i18n="get_directions">
            Get directions
        </a>
    </section>

    <!-- ===== Train Sheet ===== -->
    <section id="trainSheet" class="station-sheet station-sheet--hidden" aria-live="polite">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <div>
                <h2 id="trainSheetTitle">Train</h2>
                <p id="trainSheetSubtitle" class="station-alt"></p>
            </div>
            <button id="trainSheetClose" class="ghost-button" type="button" data-i18n="done">Done</button>
        </div>

        <div class="sheet-content">
            <div class="sheet-block">
                <div id="trainSheetBadge" class="badge-row"></div>
            </div>

            <div class="sheet-block">
                <div class="sheet-label" data-i18n="route">Route</div>
                <div id="trainSheetRoute" class="departure-list"></div>
            </div>

            <div class="sheet-block">
                <div id="trainSheetDelay" class="meta-list"></div>
            </div>

            <div id="trainSheetTelemetry" class="sheet-block" style="display:none"></div>
            <div id="trainSheetStream" class="sheet-block" style="display:none"></div>
        </div>
    </section>

    <!-- ===== Live Trains Drawer ===== -->
    <section id="liveTrainsDrawer" class="station-sheet station-sheet--hidden" aria-live="polite">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <div>
                <h2>Live trains</h2>
                <p id="liveTrainsCount" class="station-alt"></p>
            </div>
            <button id="liveTrainsDrawerClose" class="ghost-button" type="button" data-i18n="done">Done</button>
        </div>

        <div class="sheet-content">
            <div class="sheet-block">
                <div id="liveTrainsFilters" class="badge-row" style="flex-wrap:wrap;gap:6px"></div>
            </div>
            <div class="sheet-block">
                <div id="liveTrainsDrawerList" class="departure-list"></div>
            </div>
        </div>
    </section>

    <!-- ===== Ariadne Assistant ===== -->
    <button id="ariadneLauncher" class="ariadne-launcher" type="button" aria-label="Ask Ariadne" title="Ask Ariadne">
        <img class="ariadne-launcher__img" src="ariadne-mark.png" alt="Ask Ariadne" width="40" height="40">
    </button>

    <aside id="ariadnePanel" class="ariadne-panel ariadne-panel--hidden" aria-hidden="true">
        <header class="ariadne-panel__head">
            <div class="ariadne-panel__title">
                <img class="ariadne-panel__lockup" src="ariadne-lockup.png" alt="Ariadne">
            </div>
            <button id="ariadneBrain" class="chrome-button" type="button"
                    aria-label="Smarter answers"
                    title="Smarter answers: download Ariadne's on-device brain (~1.1 GB, one time)"><svg class="ic" aria-hidden="true"><use href="#ic-brain"/></svg></button>
            <button id="ariadneClose" class="ghost-button" type="button" data-i18n="done">Done</button>
        </header>
        <div id="ariadneMessages" class="ariadne-panel__messages" aria-live="polite"></div>
        <form id="ariadneForm" class="ariadne-panel__composer">
            <input id="ariadneInput" class="ariadne-panel__input" type="text" autocomplete="off"
                   placeholder="Ask Ariadne..." data-i18n-placeholder="ariadne_placeholder"
                   aria-label="Ask Ariadne">
            <button type="submit" class="primary-button ariadne-panel__send" data-i18n="send">Send</button>
        </form>
    </aside>

    <!-- Legacy: brand-block and top-bar for JS that queries .top-bar for height -->
    <header class="top-bar" style="display:none!important" aria-hidden="true">
        <div class="brand-block">
            <div class="brand">Syrmos</div>
            <div class="subtitle" data-i18n="brand_subtitle">Greece rail map</div>
            <div class="store-badges"></div>
        </div>
        <div class="map-controls">
            <div class="control-cluster"></div>
        </div>
    </header>
</div>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="web-ariadne-rag.js"></script>
<script src="web-ariadne.js"></script>
<script src="llm/ariadne-wllama.js?v=3"></script>
<script src="web-map.js"></script>
</body>
</html>
