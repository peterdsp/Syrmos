  <path d="M47 609h257" stroke="#D9D3CE" stroke-width="2"/><circle cx="48" cy="609" r="6" fill="#078A45"/><circle cx="173" cy="609" r="4" fill="#1769C2"/><circle cx="304" cy="609" r="6" fill="#6F2DA8"/><text x="43" y="630" class="tiny">Kallithea</text><text x="256" y="630" class="tiny">Chalkida</text>
