  <rect x="20" y="790" width="390" height="49" rx="17" fill="#FFF2D8"/><circle cx="42" cy="814" r="7" fill="#D58A22"/><text x="58" y="809" class="tiny" fill="#8A5B12">Scheduled results</text><text x="58" y="826" class="meta">Times and fares are approximate. Verify before travel.</text>
  <rect x="0" y="858" width="430" height="74" fill="#FFFEFC"/><line x1="0" y1="858" x2="430" y2="858" stroke="#E8E3DE"/><g class="nav" text-anchor="middle"><text x="43" y="892" font-size="20">⌂</text><text x="43" y="912" fill="#77736E">Home</text><circle cx="129" cy="886" r="14" fill="#6F2DA8"/><path d="m123 891 4-10 9-4-4 10z" fill="#fff"/><text x="129" y="912" fill="#6F2DA8">Explore</text><text x="215" y="892" font-size="19">▰</text><text x="215" y="912" fill="#77736E">Map</text><text x="301" y="892" font-size="19">✈</text><text x="301" y="912" fill="#77736E">Airport</text><text x="387" y="890" font-size="22">•••</text><text x="387" y="912" fill="#77736E">More</text></g>
