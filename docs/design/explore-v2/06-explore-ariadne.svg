<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">Syrmos Ask Ariadne screen</title><desc id="desc">A practical transit assistant that answers natural-language Greece travel questions with verifiable journey cards.</desc>
  <defs><linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EEE6F7"/><stop offset="1" stop-color="#DDEAF4"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#4C4540" flood-opacity=".1"/></filter><style>.title{font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#171614}.h2{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#171614}.body{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45413D}.meta{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#77736E}.tiny{font:650 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{fill:#fff;filter:url(#s)}.nav{font:600 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.white{fill:#fff}</style></defs>
  <rect width="430" height="932" rx="42" fill="#F7F5F2"/>
  <rect x="0" y="0" width="430" height="190" rx="42" fill="url(#head)"/>
  <path d="m31 49 8-8m-8 8 8 8" fill="none" stroke="#171614" stroke-width="2.5"/><text x="57" y="57" class="title">Ask Ariadne</text><text x="57" y="80" class="body">Routes from facts, not guesses</text>
  <circle cx="365" cy="65" r="37" fill="#6F2DA8"/><path d="M346 75c4-27 34-27 38 0M351 59l5-8 7 8m5 0 7-8 5 8M355 68h6m8 0h6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <rect x="20" y="117" width="390" height="55" rx="20" fill="#fff" filter="url(#s)"/><text x="42" y="140" class="meta">ASK ABOUT ANY JOURNEY</text><text x="42" y="158" class="body">“Somewhere quiet, under 2 hours, today”</text><circle cx="379" cy="145" r="18" fill="#171614"/><path d="m372 145 6 6 9-13" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="20" y="221" class="h2">Try asking</text>
  <g transform="translate(20 237)"><rect width="189" height="40" rx="16" fill="#fff"/><text x="16" y="25" class="body">Back before midnight</text><rect x="201" width="189" height="40" rx="16" fill="#fff"/><text x="217" y="25" class="body">No changes, under €20</text><rect y="50" width="189" height="40" rx="16" fill="#fff"/><text x="16" y="75" class="body">Beach by suburban rail</text><rect x="201" y="50" width="189" height="40" rx="16" fill="#fff"/><text x="217" y="75" class="body">Last train to Kifissia</text></g>
  <rect x="20" y="349" width="390" height="78" rx="20" fill="#6F2DA8"/><text x="38" y="377" class="body white">Somewhere quiet, under 2 hours,</text><text x="38" y="399" class="body white">leaving from Kallithea today.</text><text x="349" y="413" class="tiny" fill="#D9C7EF">YOU</text>
  <g transform="translate(20 446)">
    <circle cx="25" cy="24" r="21" fill="#EEE6F7"/><path d="M14 30c3-16 19-16 22 0M18 21h5m5 0h5" fill="none" stroke="#6F2DA8" stroke-width="2"/><text x="59" y="18" class="body" font-weight="700">I found 3 realistic options.</text><text x="59" y="39" class="meta">Sorted by total door-to-station time.</text>
  </g>
  <rect x="20" y="505" width="390" height="157" rx="22" class="card"/><rect x="20" y="505" width="6" height="157" rx="3" fill="#1769C2"/>
