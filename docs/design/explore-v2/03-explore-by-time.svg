<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">Syrmos Explore by travel time</title><desc id="desc">A time-first destination planner showing where the user can travel from Kallithea within a selected time budget.</desc>
