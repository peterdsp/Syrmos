<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">RailPulse quick report</title><desc id="desc">A two-second structured report sheet for a current train or station.</desc>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#3A3530" flood-opacity=".12"/></filter><style>.title{font:750 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#171614}.h2{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#171614}.body{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45413D}.meta{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#77736E}.tiny{font:650 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{fill:#fff;filter:url(#s)}</style></defs>
  <rect width="430" height="932" rx="42" fill="#1C1B1A" fill-opacity=".24"/>
  <rect y="56" width="430" height="876" rx="34" fill="#F7F5F2"/><rect x="183" y="68" width="64" height="5" rx="3" fill="#C8C2BC"/>
  <text x="24" y="117" class="title">Quick report</text><circle cx="390" cy="107" r="18" fill="#EAE6E1"/><path d="m384 101 12 12m0-12-12 12" stroke="#45413D" stroke-width="2"/>
  <rect x="20" y="139" width="390" height="76" rx="19" fill="#fff" filter="url(#s)"/><circle cx="53" cy="177" r="22" fill="#EEE6F7"/><text x="53" y="183" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="750" fill="#6F2DA8">1635</text><text x="87" y="168" class="body" font-weight="700">Train 1635</text><text x="87" y="189" class="meta">Athens to Kalambaka · carriage unknown</text><text x="342" y="181" class="body" fill="#6230A8">Change</text>
  <rect x="20" y="230" width="390" height="39" rx="14" fill="#E6F3EA"/><circle cx="41" cy="249" r="6" fill="#078A45"/><text x="56" y="254" class="tiny" fill="#087C43">Tap once. Report only what you can see right now.</text>
  <text x="20" y="306" class="h2">What is happening?</text>
  <g transform="translate(20 323)">
    <rect width="122" height="94" rx="20" class="card"/><circle cx="61" cy="33" r="18" fill="#FFF0D4"/><text x="61" y="40" text-anchor="middle" font-size="19">+4</text><text x="61" y="69" text-anchor="middle" class="body" font-weight="700">Delayed</text><text x="61" y="84" text-anchor="middle" class="tiny" fill="#77736E">one tap</text>
    <rect x="134" width="122" height="94" rx="20" fill="#6F2DA8" filter="url(#s)"/><circle cx="195" cy="33" r="18" fill="#fff" fill-opacity=".2"/><text x="195" y="40" text-anchor="middle" font-size="19" fill="#fff">●●●</text><text x="195" y="69" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#fff">Crowded</text><text x="195" y="84" text-anchor="middle" class="tiny" fill="#E6D8F5">selected</text>
    <rect x="268" width="122" height="94" rx="20" class="card"/><circle cx="329" cy="33" r="18" fill="#FCE5E0"/><text x="329" y="40" text-anchor="middle" font-size="20">■</text><text x="329" y="69" text-anchor="middle" class="body" font-weight="700">Stopped</text><text x="329" y="84" text-anchor="middle" class="tiny" fill="#77736E">unexpectedly</text>
    <rect y="106" width="122" height="94" rx="20" class="card"/><circle cx="61" cy="139" r="18" fill="#FCE6D8"/><text x="61" y="146" text-anchor="middle" font-size="20">☀</text><text x="61" y="175" text-anchor="middle" class="body" font-weight="700">Too hot</text><text x="61" y="190" text-anchor="middle" class="tiny" fill="#77736E">broken AC</text>
    <rect x="134" y="106" width="122" height="94" rx="20" class="card"/><circle cx="195" cy="139" r="18" fill="#E3F1E9"/><text x="195" y="146" text-anchor="middle" font-size="20">✓</text><text x="195" y="175" text-anchor="middle" class="body" font-weight="700">Clean</text><text x="195" y="190" text-anchor="middle" class="tiny" fill="#77736E">carriage</text>
    <rect x="268" y="106" width="122" height="94" rx="20" class="card"/><circle cx="329" cy="139" r="18" fill="#E3ECF5"/><text x="329" y="146" text-anchor="middle" font-size="20">♿</text><text x="329" y="175" text-anchor="middle" class="body" font-weight="700">Access</text><text x="329" y="190" text-anchor="middle" class="tiny" fill="#77736E">problem</text>
    <rect y="212" width="122" height="94" rx="20" class="card"/><circle cx="61" cy="245" r="18" fill="#E7EEF4"/><text x="61" y="252" text-anchor="middle" font-size="19">WiFi</text><text x="61" y="281" text-anchor="middle" class="body" font-weight="700">Facilities</text><text x="61" y="296" text-anchor="middle" class="tiny" fill="#77736E">toilet or power</text>
    <rect x="134" y="212" width="122" height="94" rx="20" class="card"/><circle cx="195" cy="245" r="18" fill="#FCE5E0"/><text x="195" y="252" text-anchor="middle" font-size="20">!</text><text x="195" y="281" text-anchor="middle" class="body" font-weight="700">Safety</text><text x="195" y="296" text-anchor="middle" class="tiny" fill="#77736E">urgent issue</text>
    <rect x="268" y="212" width="122" height="94" rx="20" class="card"/><circle cx="329" cy="245" r="18" fill="#EEEAE5"/><text x="329" y="251" text-anchor="middle" font-size="19">•••</text><text x="329" y="281" text-anchor="middle" class="body" font-weight="700">Other</text><text x="329" y="296" text-anchor="middle" class="tiny" fill="#77736E">structured only</text>
  </g>
  <text x="20" y="672" class="h2">Crowd level</text>
  <g transform="translate(20 688)"><rect width="73" height="42" rx="15" fill="#fff"/><text x="20" y="26" class="tiny">Empty</text><rect x="79" width="73" height="42" rx="15" fill="#fff"/><text x="94" y="26" class="tiny">Seats</text><rect x="158" width="73" height="42" rx="15" fill="#fff"/><text x="172" y="26" class="tiny">Half full</text><rect x="237" width="73" height="42" rx="15" fill="#6F2DA8"/><text x="250" y="26" class="tiny" fill="#fff">Standing</text><rect x="316" width="74" height="42" rx="15" fill="#fff"/><text x="331" y="26" class="tiny">Packed</text></g>
  <rect x="20" y="751" width="390" height="54" rx="18" fill="#087C43"/><text x="134" y="784" font-family="-apple-system,sans-serif" font-size="15" font-weight="700" fill="#fff">✓ Report sent · Crowded</text>
  <text x="45" y="831" class="meta">One tap sent it. Refine the level above or undo for 10 seconds.</text>
  <rect x="20" y="851" width="390" height="56" rx="18" fill="#FFF0D4"/><circle cx="43" cy="879" r="8" fill="#D58A22"/><text x="59" y="874" class="tiny" fill="#8A5B12">For immediate danger, contact emergency services.</text><text x="59" y="891" class="meta">RailPulse is not an emergency channel.</text>
</svg>
