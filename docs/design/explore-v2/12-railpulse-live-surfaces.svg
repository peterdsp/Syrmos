<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">RailPulse Live Activity and Apple Watch</title><desc id="desc">A system-surface concept showing community railway intelligence on the Lock Screen and Apple Watch.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111820"/><stop offset="1" stop-color="#28183C"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter><style>.title{font:750 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.h2{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.body{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.meta{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#AEB5BE}.tiny{font:650 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style></defs>
  <rect width="900" height="700" rx="34" fill="url(#bg)"/><text x="44" y="58" class="title">RailPulse beyond the app</text><text x="44" y="84" class="meta">The useful community signal follows the journey, without opening a feed.</text>
  <text x="96" y="132" class="h2">Lock Screen Live Activity</text><text x="621" y="132" class="h2">Apple Watch</text>
  <rect x="74" y="153" width="450" height="450" rx="62" fill="#22252B" stroke="#4C5057" stroke-width="3" filter="url(#s)"/><rect x="221" y="169" width="156" height="32" rx="16" fill="#050506"/><text x="102" y="221" class="meta">14:39</text><text x="464" y="221" class="meta">•••</text>
  <rect x="96" y="245" width="406" height="195" rx="27" fill="#111318"/>
  <circle cx="128" cy="279" r="18" fill="#1769C2"/><text x="128" y="285" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="750" fill="#fff">M3</text><text x="158" y="274" class="body" font-weight="700">Airport train</text><text x="158" y="294" class="meta">toward Airport · Platform 2</text><text x="451" y="286" font-family="-apple-system,sans-serif" font-size="25" font-weight="750" fill="#fff">3 min</text>
  <line x1="120" y1="321" x2="478" y2="321" stroke="#343841"/><circle cx="130" cy="351" r="8" fill="#F0B24A"/><text x="150" y="347" class="body" font-weight="700">Community: crowded</text><text x="150" y="368" class="meta">Standing room only · 31 confirmations</text><text x="433" y="356" class="tiny" fill="#F0B24A">90 sec</text>
  <rect x="117" y="391" width="164" height="31" rx="15" fill="#2F2735"/><text x="137" y="411" class="tiny" fill="#DFC8F5">Open RailPulse</text><rect x="293" y="391" width="188" height="31" rx="15" fill="#21322A"/><text x="313" y="411" class="tiny" fill="#92E0AE">Confirm crowded</text>
  <rect x="96" y="460" width="406" height="105" rx="27" fill="#4A1820"/><circle cx="127" cy="493" r="14" fill="#E8505B"/><text x="127" y="499" text-anchor="middle" fill="#fff">!</text><text x="151" y="490" class="body" font-weight="700">Unexpected stop ahead</text><text x="151" y="511" class="meta">Community supported · 18 confirmations</text><text x="117" y="544" class="tiny" fill="#F5BDC1">Not an official operator alert · updated 40 sec ago</text>
  <rect x="596" y="153" width="236" height="286" rx="72" fill="#08090B" stroke="#4C5057" stroke-width="6" filter="url(#s)"/><rect x="612" y="171" width="204" height="250" rx="58" fill="#15171B"/>
  <text x="714" y="206" text-anchor="middle" class="tiny" fill="#AEB5BE">TRAIN 1635</text><text x="714" y="235" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="20" font-weight="750" fill="#fff">Standing</text><circle cx="714" cy="274" r="28" fill="#F0B24A"/><text x="714" y="281" text-anchor="middle" font-size="21">●●●</text><text x="714" y="319" text-anchor="middle" class="body">31 confirmed</text><text x="714" y="340" text-anchor="middle" class="meta">updated 90 sec</text>
  <rect x="644" y="363" width="140" height="37" rx="18" fill="#6F2DA8"/><text x="714" y="386" text-anchor="middle" class="tiny" fill="#fff">Report in one tap</text>
  <text x="612" y="488" class="h2">Watch quick actions</text>
  <rect x="596" y="511" width="236" height="111" rx="28" fill="#20232A"/><g transform="translate(612 526)"><rect width="94" height="35" rx="16" fill="#3B2A47"/><text x="47" y="22" text-anchor="middle" class="tiny" fill="#E4D0F5">Crowded</text><rect x="102" width="94" height="35" rx="16" fill="#4B252A"/><text x="149" y="22" text-anchor="middle" class="tiny" fill="#F5C2C5">Delay</text><rect y="43" width="94" height="35" rx="16" fill="#513A24"/><text x="47" y="65" text-anchor="middle" class="tiny" fill="#F4D3A8">Broken AC</text><rect x="102" y="43" width="94" height="35" rx="16" fill="#223D2C"/><text x="149" y="65" text-anchor="middle" class="tiny" fill="#B8E6C6">Normal</text></g>
  <text x="44" y="664" class="meta">Only fresh, relevant, high-confidence community signals appear on system surfaces. Safety alerts require moderation.</text>
</svg>
