<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">Syrmos Explore Discover screen</title>
  <desc id="desc">A Greece-wide rail discovery screen with a universal search, destination hero, live services, and time-based recommendations.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#759EC4"/><stop offset=".48" stop-color="#E7B697"/><stop offset="1" stop-color="#714B44"/></linearGradient>
    <linearGradient id="heroShade" x1="0" y1="0" x2="0" y2="1"><stop offset=".25" stop-color="#101820" stop-opacity="0"/><stop offset="1" stop-color="#101820" stop-opacity=".9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#4C4540" flood-opacity=".12"/></filter>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#171614}.h2{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#171614}.body{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45413D}.meta{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#77736E}.tiny{font:600 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#77736E}.white{fill:#fff}.card{fill:#fff;filter:url(#shadow)}.chip{fill:#EEEAE5}.nav{font:600 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.number{font:750 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#171614}
    </style>
  </defs>
  <rect width="430" height="932" rx="42" fill="#F7F5F2"/>
  <text x="24" y="54" class="title">Explore</text>
  <text x="24" y="76" class="body">Greece, one journey at a time</text>
  <circle cx="395" cy="53" r="18" fill="#fff"/><path d="M390 54c0-5 2-8 5-8s5 3 5 8l2 3h-14z" fill="none" stroke="#171614" stroke-width="1.8"/><circle cx="395" cy="59" r="1.5" fill="#171614"/>

  <rect x="20" y="92" width="390" height="48" rx="17" fill="#fff" filter="url(#shadow)"/>
  <circle cx="42" cy="116" r="7" fill="none" stroke="#6F6A65" stroke-width="2"/><path d="m47 121 5 5" stroke="#6F6A65" stroke-width="2" stroke-linecap="round"/>
  <text x="62" y="121" class="body" fill="#77736E">Destination, station, line or event</text>
  <rect x="20" y="151" width="390" height="38" rx="14" fill="#EAE6E1"/>
  <rect x="23" y="154" width="191" height="32" rx="11" fill="#fff"/>
  <text x="91" y="175" class="body" font-weight="700">Discover</text>
  <text x="285" y="175" class="body">Network</text>

  <rect x="20" y="205" width="390" height="240" rx="25" fill="url(#sky)"/>
  <circle cx="346" cy="250" r="46" fill="#FFE3B0" opacity=".65"/>
  <path d="M20 325 90 260l48 43 60-82 59 90 48-49 105 73v110H20z" fill="#4D5B58" opacity=".86"/>
  <path d="M82 312h46v53H82zM92 289h26v76H92zM160 309h56v56h-56zM181 280h16v85h-16z" fill="#E8DDD1" opacity=".9"/>
  <path d="M20 205h390v240H20z" rx="25" fill="url(#heroShade)"/>
  <rect x="38" y="225" width="145" height="28" rx="14" fill="#171614" fill-opacity=".58"/>
  <text x="51" y="244" class="tiny white">★ DESTINATION OF THE DAY</text>
  <text x="38" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="750" font-size="29" fill="#fff">Meteora</text>
  <text x="38" y="381" class="body white">A rail escape above the clouds</text>
  <g transform="translate(38 397)"><circle cx="7" cy="7" r="6" fill="none" stroke="#fff"/><path d="M7 3v4l3 2" stroke="#fff" stroke-width="1.4"/><text x="20" y="11" class="tiny white">3 h 48 min</text><rect x="100" y="1" width="12" height="12" rx="3" fill="none" stroke="#fff"/><text x="119" y="11" class="tiny white">Next 10:58</text><text x="183" y="11" class="tiny white">from €18*</text></g>
  <rect x="276" y="391" width="116" height="38" rx="14" fill="#fff"/><text x="299" y="415" class="body" font-weight="700">See journey</text><path d="m373 406 5 5-5 5" fill="none" stroke="#171614" stroke-width="1.7"/>

  <text x="20" y="480" class="h2">Live now</text><text x="350" y="480" class="body" fill="#6230A8">View all</text>
  <g transform="translate(20 495)">
    <rect width="119" height="137" rx="19" class="card"/><rect x="12" y="12" width="95" height="50" rx="12" fill="#DBEAF8"/><path d="M30 50 59 22l34 28" fill="#7DB0D7"/><text x="12" y="80" class="body" font-weight="700">Airport</text><text x="12" y="98" class="meta">Suburban in</text><text x="12" y="122" class="number" fill="#078A45">3 min</text><circle cx="98" cy="117" r="5" fill="#078A45"/>
    <rect x="130" width="119" height="137" rx="19" class="card"/><rect x="142" y="12" width="95" height="50" rx="12" fill="#DCEFE8"/><path d="M150 52h78l-13-24h-48z" fill="#267D73"/><text x="142" y="80" class="body" font-weight="700">Piraeus</text><text x="142" y="98" class="meta">M1 in</text><text x="142" y="122" class="number" fill="#D76521">7 min</text><circle cx="228" cy="117" r="5" fill="#D76521"/>
    <rect x="260" width="119" height="137" rx="19" class="card"/><rect x="272" y="12" width="95" height="50" rx="12" fill="#EEE7F6"/><path d="M292 53h55l-8-29h-39z" fill="#8E71B3"/><text x="272" y="80" class="body" font-weight="700">Monastiraki</text><text x="272" y="98" class="meta">M3 in</text><text x="272" y="122" class="number" fill="#078A45">2 min</text><circle cx="358" cy="117" r="5" fill="#078A45"/>
  </g>

  <text x="20" y="672" class="h2">Go by time</text><text x="337" y="672" class="body" fill="#6230A8">Change</text>
  <g transform="translate(20 687)">
    <rect width="86" height="68" rx="17" fill="#171614"/><text x="19" y="30" font-family="-apple-system,sans-serif" font-size="18" font-weight="750" fill="#fff">30</text><text x="18" y="51" class="tiny white">minutes</text>
    <rect x="96" width="86" height="68" rx="17" class="card"/><text x="115" y="30" class="number">60</text><text x="114" y="51" class="tiny">minutes</text>
    <rect x="192" width="86" height="68" rx="17" class="card"/><text x="211" y="30" class="number">90</text><text x="210" y="51" class="tiny">minutes</text>
    <rect x="288" width="102" height="68" rx="17" class="card"/><text x="306" y="30" class="number">2 h+</text><text x="306" y="51" class="tiny">day trips</text>
  </g>
  <rect x="20" y="772" width="390" height="72" rx="20" fill="#EEE8F6"/>
  <circle cx="53" cy="808" r="19" fill="#6C35AE"/><path d="M45 813c4-13 12-13 16 0M49 805h8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="82" y="801" class="body" font-weight="700">Ask Ariadne</text><text x="82" y="821" class="meta">“Where can I go before sunset?”</text><path d="m382 802 6 6-6 6" fill="none" stroke="#6C35AE" stroke-width="2"/>

  <rect x="0" y="858" width="430" height="74" fill="#FFFEFC"/><line x1="0" y1="858" x2="430" y2="858" stroke="#E8E3DE"/>
  <g class="nav" text-anchor="middle"><text x="43" y="892" font-size="20">⌂</text><text x="43" y="912" fill="#77736E">Home</text><circle cx="129" cy="886" r="14" fill="#6F2DA8"/><path d="m123 891 4-10 9-4-4 10z" fill="#fff"/><text x="129" y="912" fill="#6F2DA8">Explore</text><text x="215" y="892" font-size="19">▰</text><text x="215" y="912" fill="#77736E">Map</text><text x="301" y="892" font-size="19">✈</text><text x="301" y="912" fill="#77736E">Airport</text><text x="387" y="890" font-size="22">•••</text><text x="387" y="912" fill="#77736E">More</text></g>
</svg>
